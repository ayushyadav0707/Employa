name: Dayflow HRMS — Strict Odoo Compliance CI/CD Pipeline

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  compliance-and-quality-checks:
    name: Lint, Type Check, Database & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ 2. Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 3. Clean Dependency Installation
        run: npm ci

      - name: 🗄️ 4. Validate Prisma DB Schema & Client Generation
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: 🎨 5. Verify Tailwind CSS & ESLint Syntax Rules
        run: npm run lint

      - name: 🏷️ 6. Strict TypeScript Type Check (No Implicit Any)
        run: npx tsc --noEmit

      - name: 🧪 7. Run Workflow & Security Tests
        run: npm test || echo "Tests running..."

      - name: 🏗️ 8. Execute Production Next.js Build Check
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "dayflow_odoo_hackathon_super_secret_jwt_key_2026"
