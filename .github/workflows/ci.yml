name: Dayflow HRMS — Strict Odoo Compliance CI/CD Pipeline

on:
  push:
    branches: [ main, dev, "feature/**", "Attendance-**", "Leave-**", "Employee**" ]
  pull_request:
    branches: [ main, dev ]

jobs:
  compliance-and-quality-checks:
    name: Lint, Type Check, Database & Build Validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      POSTGRES_PRISMA_URL: "file:./dev.db"
      POSTGRES_URL_NON_POOLING: "file:./dev.db"
      JWT_SECRET: "dayflow_odoo_hackathon_super_secret_jwt_key_2026"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: 📥 1. Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 3. Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 🗄️ 4. Validate Prisma DB Schema & Sync Database
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma db push --skip-generate

      - name: 🎨 5. Verify ESLint Syntax Rules
        run: npm run lint

      - name: 🏷️ 6. Strict TypeScript Type Check
        run: npx tsc --noEmit

      - name: 🧪 7. Run Security & Test Suite
        run: npm test

      - name: 🏗️ 8. Execute Production Next.js Build Check
        run: npm run build
